<!-- @dsCard group="PREDICTION-ENGINE / Backtest" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --green:#34C759; --red:#FF3B30; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .strategies { display: flex; gap: 6px; overflow-x: auto; }
  .strat { padding: 6px 12px; border: 1px solid var(--hairline); border-radius: 8px; font-size: 11.5px; color: var(--mute); flex-shrink: 0; white-space: nowrap; }
  .strat.active { background: var(--ink); color: #000; font-weight: 600; }
  .run-btn { padding: 10px; background: var(--accent); color: #000; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; text-align: center; }
  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 12px; }
  .stat-label { font-size: 10px; color: var(--mute); }
  .stat-value { font-size: 17px; font-weight: 600; margin-top: 3px; }
  .up { color: var(--green); } .down { color: var(--red); }
</style>
<div class="page">
  <h1>Backtest</h1>
  <div class="strategies"><div class="strat active">MA Crossover</div><div class="strat">RSI</div><div class="strat">MACD</div></div>
  <div class="run-btn">▶ Run Backtest</div>
  <div class="results">
    <div class="stat-card"><div class="stat-label">Total Return</div><div class="stat-value up">+34.2%</div></div>
    <div class="stat-card"><div class="stat-label">Sharpe</div><div class="stat-value">1.42</div></div>
    <div class="stat-card"><div class="stat-label">Max DD</div><div class="stat-value down">-12.8%</div></div>
    <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value">58%</div></div>
  </div>
</div>
