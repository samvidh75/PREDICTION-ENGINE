<!-- @dsCard group="PREDICTION-ENGINE / Waitlist" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 32px 20px; display: grid; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 12px; padding: 24px; display: grid; gap: 14px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--body); font-size: 12.5px; margin: 0; }
  input { height: 44px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); border-radius: 6px; padding: 0 12px; color: var(--ink); font-size: 13px; }
  .cta { height: 44px; background: var(--ink); color: #000; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; }
</style>
<div class="page">
  <div class="card">
    <h1>Join the waitlist</h1>
    <p class="sub">We're onboarding in small batches.</p>
    <input placeholder="Your name" />
    <input placeholder="you@email.com" />
    <div class="cta">Join waitlist</div>
  </div>
</div>
