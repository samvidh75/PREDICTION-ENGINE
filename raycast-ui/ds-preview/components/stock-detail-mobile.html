<!-- @dsCard group="PREDICTION-ENGINE / StockDetail" -->
<style>
  :root {
    --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F;
    --green:#34C759; --bg-sheet: rgba(18,18,20,0.55);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 16px; display: grid; gap: 16px; }
  .header h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .header .name { color: var(--body); font-size: 13px; }
  .price-row { display: flex; justify-content: space-between; align-items: baseline; }
  .price { font-size: 24px; font-weight: 600; }
  .change { color: var(--green); font-size: 13px; }
  .timeframes { display: flex; gap: 4px; overflow-x: auto; }
  .tf { padding: 5px 10px; border-radius: 6px; font-size: 12px; color: var(--mute); flex-shrink: 0; }
  .tf.active { background: var(--bg-sheet); border: 1px solid var(--hairline); color: var(--ink); }
  .chart-card { height: 200px; background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 12px; }
  .news-card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 8px; padding: 16px; }
  .news-card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }
  .news-row { padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 12px; }
  .news-row:first-of-type { border-top: none; }
  .news-row .meta { color: var(--mute); font-size: 10.5px; }
</style>
<div class="page">
  <div class="header"><h1>BDO</h1><div class="name">BDO Unibank, Inc.</div></div>
  <div class="price-row"><div class="price">₱142.50</div><div class="change">+2.80 (+2.0%)</div></div>
  <div class="timeframes">
    <div class="tf">1D</div><div class="tf">5D</div><div class="tf active">1M</div><div class="tf">3M</div><div class="tf">1Y</div>
  </div>
  <div class="chart-card">Price chart — 1M</div>
  <div class="news-card">
    <h3>News</h3>
    <div class="news-row">BDO reports steady loan growth in Q2 earnings call<div class="meta">2 hours ago</div></div>
  </div>
</div>
