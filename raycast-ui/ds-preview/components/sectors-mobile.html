<!-- @dsCard group="PREDICTION-ENGINE / Sectors" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 20px 16px; display: grid; gap: 18px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .sub { color: var(--body); font-size: 12.5px; line-height: 1.5; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
  .name { font-size: 13px; font-weight: 600; }
  .count { font-size: 10.5px; color: var(--mute); }
</style>
<div class="page">
  <div><h1>Sector Research</h1><p class="sub">Compare company scorecards and peer performance across sectors.</p></div>
  <div class="grid">
    <div class="card"><div class="name">Banking</div><div class="count">12 companies</div></div>
    <div class="card"><div class="name">IT Services</div><div class="count">8 companies</div></div>
    <div class="card"><div class="name">Pharmaceuticals</div><div class="count">10 companies</div></div>
    <div class="card"><div class="name">Automotive</div><div class="count">9 companies</div></div>
    <div class="card"><div class="name">FMCG</div><div class="count">7 companies</div></div>
    <div class="card"><div class="name">Oil & Gas</div><div class="count">6 companies</div></div>
  </div>
</div>
