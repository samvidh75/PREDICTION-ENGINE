<!-- @dsCard group="PREDICTION-ENGINE / ScannerLanding" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 720px; padding: 48px 32px; display: grid; gap: 24px; text-align: center; justify-items: center; }
  .tag { font-size: 11px; padding: 4px 12px; border-radius: 10px; background: rgba(255,107,74,0.14); color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
  h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--body); font-size: 14.5px; max-width: 480px; margin: 0; }
  .cta { padding: 12px 28px; background: var(--ink); color: #000; border-radius: 8px; font-size: 14px; font-weight: 600; }
</style>
<div class="page">
  <span class="tag">Scanner Preset</span>
  <h1>Quality Compounders</h1>
  <p class="sub">Steady earners with low debt and durable returns on equity. A curated starting point, not a black box — every result shows its factor breakdown.</p>
  <div class="cta">Open Scanner</div>
</div>
