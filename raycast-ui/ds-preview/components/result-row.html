<!-- @dsCard group="Components" -->
<style>
  :root {
    --bg-base: #0b0b0c;
    --bg-card: #121214;
    --bg-card-alt: #1c1c1e;
    --border-hairline: #2c2c2e;
    --text-primary: #f4f4f5;
    --text-muted: #71717a;
  }
  body { margin: 0; background: var(--bg-card); font-family: -apple-system, Inter, sans-serif; }
  .stage { display: flex; gap: 16px; padding: 32px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: 12px;
    border: 1px solid transparent;
    width: 220px;
  }
  .row[data-state="hover"], .row[data-state="selected"] { background: var(--bg-card-alt); }
  .row[data-state="selected"] { border-color: var(--border-hairline); }
  .icon { width: 28px; height: 28px; border-radius: 8px; background: var(--bg-card-alt); border: 1px solid var(--border-hairline); flex-shrink: 0; }
  .title { font-size: 14px; color: var(--text-primary); line-height: 1.2; }
  .subtitle { font-size: 12px; color: var(--text-muted); line-height: 1.2; }
</style>
<div class="stage">
  <div class="row" data-state="default">
    <div class="icon"></div>
    <div><div class="title">Search Files</div><div class="subtitle">System</div></div>
  </div>
  <div class="row" data-state="hover">
    <div class="icon"></div>
    <div><div class="title">Search Files</div><div class="subtitle">System</div></div>
  </div>
  <div class="row" data-state="selected">
    <div class="icon"></div>
    <div><div class="title">Search Files</div><div class="subtitle">System</div></div>
  </div>
</div>
