<!-- @dsCard group="PREDICTION-ENGINE / LiveMarket" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --green:#34C759; --red:#FF3B30; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 1040px; padding: 32px; display: grid; gap: 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--mute); text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--hairline); }
  td { padding: 10px; font-size: 13px; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  .sym { font-weight: 600; }
  .up { color: var(--green); } .down { color: var(--red); }
</style>
<div class="page">
  <div class="head"><h1>Live Market</h1><div class="status"><span class="dot"></span>Connected</div></div>
  <table>
    <thead><tr><th>Symbol</th><th>LTP</th><th>Change</th><th>Volume</th></tr></thead>
    <tbody>
      <tr><td class="sym">HBL</td><td>Rs. 128.40</td><td class="up">+1.8%</td><td>2.4L</td></tr>
      <tr><td class="sym">ENGRO</td><td>Rs. 312.60</td><td class="down">-0.6%</td><td>1.1L</td></tr>
      <tr><td class="sym">UBL</td><td>Rs. 178.20</td><td class="up">+0.9%</td><td>84.2k</td></tr>
      <tr><td class="sym">OGDC</td><td>Rs. 98.75</td><td class="up">+2.3%</td><td>3.1L</td></tr>
      <tr><td class="sym">MCB</td><td>Rs. 205.10</td><td class="down">-1.1%</td><td>62.5k</td></tr>
    </tbody>
  </table>
</div>
