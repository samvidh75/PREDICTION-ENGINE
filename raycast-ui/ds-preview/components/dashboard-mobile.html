<!-- @dsCard group="PREDICTION-ENGINE / Dashboard" -->
<style>
  :root {
    --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F;
    --accent:#FF6B4A; --green:#34C759; --red:#FF3B30;
    --bg-sheet: rgba(18,18,20,0.55);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 8px; padding: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-label { font-size: 11px; color: var(--mute); }
  .stat-value { font-size: 19px; font-weight: 600; }
  .stat-value.up { color: var(--green); }
  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 13px; }
  .list-row:first-of-type { border-top: none; }
  .sym { font-weight: 600; }
  .chg.up { color: var(--green); } .chg.down { color: var(--red); }
</style>
<div class="page">
  <div class="card">
    <h3>Portfolio Overview</h3>
    <div class="stat-grid">
      <div><div class="stat-label">Total Value</div><div class="stat-value">₱1,284,600</div></div>
      <div><div class="stat-label">Today</div><div class="stat-value up">+2.14%</div></div>
    </div>
  </div>
  <div class="card">
    <h3>Watchlist</h3>
    <div class="list-row"><span class="sym">BDO</span><span class="chg up">+1.8%</span></div>
    <div class="list-row"><span class="sym">JFC</span><span class="chg down">-0.6%</span></div>
    <div class="list-row"><span class="sym">AC</span><span class="chg up">+0.9%</span></div>
  </div>
  <div class="card">
    <h3>Trending</h3>
    <div class="list-row"><span class="sym">TEL</span><span class="chg up">+4.1%</span></div>
    <div class="list-row"><span class="sym">GLO</span><span class="chg down">-1.2%</span></div>
  </div>
</div>
