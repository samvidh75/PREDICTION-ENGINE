<!-- @dsCard group="PREDICTION-ENGINE / SectorResearch" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 20px 16px; display: grid; gap: 14px; }
  .crumb { font-size: 12px; color: var(--body); }
  .crumb span { color: var(--accent); }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .desc { color: var(--body); font-size: 12.5px; line-height: 1.5; margin: 0; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; color: var(--mute); }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 12.5px; }
  .row:first-of-type { border-top: none; }
</style>
<div class="page">
  <div class="crumb"><span>Sectors</span> / Banking</div>
  <h1>Banking</h1>
  <p class="desc">12 companies tracked across quality, growth, valuation, momentum and risk factors.</p>
  <div class="card">
    <h3>Top companies</h3>
    <div class="row"><span>BDO</span><span>92</span></div>
    <div class="row"><span>MEBL</span><span>88</span></div>
    <div class="row"><span>HBL</span><span>81</span></div>
  </div>
</div>
