<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 40px 20px; display: flex; justify-content: center; }
  .card { width: 100%; background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 12px; padding: 24px; text-align: center; display: grid; gap: 12px; }
  .icon { font-size: 34px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  p { color: var(--body); font-size: 12.5px; line-height: 1.5; margin: 0; }
  .cta { display: block; padding: 11px; background: var(--ink); color: #000; border-radius: 8px; font-size: 13px; font-weight: 600; }
</style>
<div class="page">
  <div class="card">
    <div class="icon">🔌</div>
    <h1>Not connected</h1>
    <p>Please authenticate with Zerodha to view portfolio detail.</p>
    <div class="cta">Connect Zerodha</div>
  </div>
</div>
