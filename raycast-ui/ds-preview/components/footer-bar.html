<!-- @dsCard group="Components" -->
<style>
  :root {
    --bg-base: #0b0b0c;
    --bg-card-alt: #1c1c1e;
    --border-hairline: #2c2c2e;
    --text-muted: #71717a;
    --text-secondary: #a1a1aa;
  }
  body { margin: 0; background: var(--bg-base); font-family: -apple-system, Inter, sans-serif; }
  .stage { padding: 32px; }
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    width: 480px; padding: 8px 16px;
    border-top: 1px solid var(--border-hairline);
    font-size: 12px; color: var(--text-muted);
  }
  .hints { display: flex; gap: 16px; align-items: center; }
  .hint { display: flex; gap: 4px; align-items: center; }
  .kbd {
    display: inline-flex; padding: 2px 6px; font-size: 11px; font-weight: 500;
    border-radius: 8px; background: var(--bg-card-alt); border: 1px solid var(--border-hairline);
    color: var(--text-secondary);
  }
</style>
<div class="stage">
  <div class="footer">
    <span>Raycast</span>
    <div class="hints">
      <span class="hint">Open Application <kbd class="kbd">↵</kbd></span>
      <span class="hint">Actions <kbd class="kbd">⌘K</kbd></span>
    </div>
  </div>
</div>
