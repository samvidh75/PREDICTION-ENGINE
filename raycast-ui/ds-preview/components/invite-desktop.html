<!-- @dsCard group="PREDICTION-ENGINE / Invite" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:420px; }
  .card { width: 480px; background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 12px; padding: 32px; display: grid; gap: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .sub { color: var(--body); font-size: 13.5px; line-height: 1.6; margin: 0; }
  .link-row { display: flex; gap: 8px; }
  .link-box { flex: 1; height: 44px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); border-radius: 6px; padding: 0 14px; display: flex; align-items: center; font-size: 13px; color: var(--body); font-family: 'SF Mono', monospace; }
  .copy-btn { height: 44px; padding: 0 20px; background: var(--ink); color: #000; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; }
</style>
<div class="card">
  <h1>Invite Friends</h1>
  <p class="sub">Share your referral link — friends who join get early access.</p>
  <div class="link-row">
    <div class="link-box">stockstory-pakistan.com/invite/ax7k2m</div>
    <div class="copy-btn">Copy</div>
  </div>
</div>
