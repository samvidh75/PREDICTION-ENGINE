<!-- @dsCard group="PREDICTION-ENGINE / OpsDashboard" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --green:#34C759; --red:#FF3B30; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 1100px; padding: 32px; display: grid; gap: 20px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
  .lock { font-size: 13px; color: var(--mute); font-weight: 400; border: 1px solid var(--hairline); padding: 3px 10px; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .stat-card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px; }
  .stat-label { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-size: 22px; font-weight: 600; margin-top: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; }
  .pill-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--hairline); font-size: 13px; }
  .pill-row:first-of-type { border-top: none; }
  .ok { color: var(--green); } .warn { color: var(--red); }
</style>
<div class="page">
  <h1>Ops Dashboard <span class="lock">🔒 Internal</span></h1>
  <div class="grid">
    <div class="stat-card"><div class="stat-label">Server Uptime</div><div class="stat-value">14d 6h</div></div>
    <div class="stat-card"><div class="stat-label">LLM Calls (24h)</div><div class="stat-value">8,412</div></div>
    <div class="stat-card"><div class="stat-label">Avg Latency</div><div class="stat-value">642ms</div></div>
    <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value">3,208</div></div>
  </div>
  <div class="row2">
    <div class="card">
      <h3>Subscription Distribution</h3>
      <div class="pill-row"><span>Free</span><span>2,840</span></div>
      <div class="pill-row"><span>Research Plus</span><span>312</span></div>
      <div class="pill-row"><span>Research Pro</span><span>56</span></div>
    </div>
    <div class="card">
      <h3>Pipeline Runs (recent)</h3>
      <div class="pill-row"><span>Fundamentals ingest</span><span class="ok">✓ Success</span></div>
      <div class="pill-row"><span>Universe expansion</span><span class="ok">✓ Success</span></div>
      <div class="pill-row"><span>News backfill</span><span class="warn">⚠ Partial</span></div>
    </div>
  </div>
</div>
