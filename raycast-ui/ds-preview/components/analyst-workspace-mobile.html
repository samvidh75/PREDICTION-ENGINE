<!-- @dsCard group="PREDICTION-ENGINE / AnalystWorkspace" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 20px 16px; display: grid; gap: 14px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .query-input { height: 44px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); border-radius: 8px; padding: 0 14px; color: var(--ink); font-size: 13px; }
  .run-btn { height: 44px; background: var(--ink); color: #000; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 11px; color: var(--mute); text-transform: uppercase; }
  .output { font-size: 12.5px; color: var(--body); line-height: 1.55; }
</style>
<div class="page">
  <h1>Analyst Workspace</h1>
  <input class="query-input" placeholder="Ask about a stock or sector…" />
  <div class="run-btn">Run analysis</div>
  <div class="card"><h3>Analyst output</h3><p class="output">BDO's loan growth accelerated in Q2, with net interest margins holding steady against a rising rate environment.</p></div>
</div>
