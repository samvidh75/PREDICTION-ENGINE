<!-- @dsCard group="PREDICTION-ENGINE / Billing" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --hairline:#1F1F1F; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 48px 24px; text-align: center; }
  .emoji { font-size: 44px; margin-bottom: 10px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; }
  p { color: var(--body); font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  .cta { display: block; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; }
  .cta.primary { background: var(--ink); color: #000; }
  .cta.secondary { border: 1px solid var(--hairline); color: var(--ink); }
</style>
<div class="page">
  <div class="emoji">🤷</div>
  <h1>Payment Cancelled</h1>
  <p>No worries — your free plan remains active.</p>
  <div class="cta primary">Back to Pricing</div>
  <div class="cta secondary">Go to Dashboard</div>
</div>
