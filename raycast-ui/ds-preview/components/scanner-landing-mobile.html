<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --accent:#FF6B4A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 36px 20px; display: grid; gap: 16px; text-align: center; justify-items: center; }
  .tag { font-size: 10px; padding: 3px 10px; border-radius: 10px; background: rgba(255,107,74,0.14); color: var(--accent); text-transform: uppercase; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--body); font-size: 12.5px; margin: 0; }
  .cta { padding: 12px 24px; background: var(--ink); color: #000; border-radius: 8px; font-size: 13px; font-weight: 600; width: 100%; }
</style>
<div class="page">
  <span class="tag">Scanner Preset</span>
  <h1>Quality Compounders</h1>
  <p class="sub">Steady earners with low debt and durable returns on equity.</p>
  <div class="cta">Open Scanner</div>
</div>
