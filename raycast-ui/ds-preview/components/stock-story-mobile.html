<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 28px 18px; display: grid; gap: 22px; text-align: center; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--body); font-size: 12.5px; margin: 0; }
  .chapters { display: grid; gap: 12px; text-align: left; }
  .chapter { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px; display: flex; gap: 10px; }
  .chapter-icon { color: var(--accent); font-size: 16px; }
  .chapter-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .chapter-desc { font-size: 11.5px; color: var(--body); line-height: 1.5; }
</style>
<div class="page">
  <div><h1>The Story of BDO</h1><p class="sub">A narrative walkthrough of the numbers.</p></div>
  <div class="chapters">
    <div class="chapter"><span class="chapter-icon">⚡</span><div><div class="chapter-title">The Setup</div><div class="chapter-desc">How BDO built its market position.</div></div></div>
    <div class="chapter"><span class="chapter-icon">↗</span><div><div class="chapter-title">The Growth</div><div class="chapter-desc">Loan book expansion vs. sector.</div></div></div>
    <div class="chapter"><span class="chapter-icon">⛨</span><div><div class="chapter-title">The Risk</div><div class="chapter-desc">What could change the story.</div></div></div>
  </div>
</div>
