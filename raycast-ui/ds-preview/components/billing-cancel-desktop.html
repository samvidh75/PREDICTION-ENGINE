<!-- @dsCard group="PREDICTION-ENGINE / Billing" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:420px; }
  .wrap { text-align: center; max-width: 480px; padding: 32px; }
  .emoji { font-size: 56px; margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; }
  p { color: var(--body); font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
  .ctas { display: flex; gap: 10px; justify-content: center; }
  .cta { display: inline-block; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .cta.primary { background: var(--ink); color: #000; }
  .cta.secondary { border: 1px solid var(--hairline); color: var(--ink); }
</style>
<div class="wrap">
  <div class="emoji">🤷</div>
  <h1>Payment Cancelled</h1>
  <p>No worries — your free plan remains active. You can come back any time to upgrade when you're ready.</p>
  <div class="ctas">
    <div class="cta primary">Back to Pricing</div>
    <div class="cta secondary">Go to Dashboard</div>
  </div>
</div>
