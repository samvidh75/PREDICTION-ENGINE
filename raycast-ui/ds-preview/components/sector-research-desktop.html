<!-- @dsCard group="PREDICTION-ENGINE / SectorResearch" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 720px; padding: 32px; display: grid; gap: 20px; }
  .crumb { font-size: 13px; color: var(--body); }
  .crumb span { color: var(--accent); cursor: pointer; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .desc { color: var(--body); font-size: 14px; line-height: 1.6; margin: 0; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 20px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mute); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--hairline); }
  th { color: var(--mute); font-weight: 500; font-size: 11px; text-transform: uppercase; }
</style>
<div class="page">
  <div class="crumb"><span>Sectors</span> / Banking</div>
  <h1>Banking</h1>
  <p class="desc">PSX banking sector including public and private banks. 12 companies tracked across quality, growth, valuation, momentum and risk factors.</p>
  <div class="card">
    <h3>Top companies</h3>
    <table>
      <thead><tr><th>Symbol</th><th>Company</th><th>Score</th></tr></thead>
      <tbody>
        <tr><td>BDO</td><td>BDO Unibank</td><td>92</td></tr>
        <tr><td>MEBL</td><td>Meezan Bank</td><td>88</td></tr>
        <tr><td>HBL</td><td>Habib Bank</td><td>81</td></tr>
      </tbody>
    </table>
  </div>
</div>
