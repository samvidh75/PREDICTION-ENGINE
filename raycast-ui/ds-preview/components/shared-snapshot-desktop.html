<!-- @dsCard group="PREDICTION-ENGINE / SharedResearchSnapshot" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 680px; padding: 32px; display: grid; gap: 20px; }
  .badge { font-size: 11px; color: var(--mute); border: 1px solid var(--hairline); padding: 3px 10px; border-radius: 6px; width: fit-content; }
  h1 { font-size: 26px; font-weight: 700; margin: 0; }
  .card { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 20px; display: grid; gap: 10px; }
  .card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card p { margin: 0; font-size: 13px; color: var(--body); line-height: 1.6; }
  .footer-note { font-size: 11.5px; color: var(--mute); text-align: center; }
</style>
<div class="page">
  <span class="badge">Shared research snapshot · read-only</span>
  <h1>BDO — Research Snapshot</h1>
  <div class="card"><h3>Investment Thesis</h3><p>Steady loan growth with conservative provisioning against a rising rate environment.</p></div>
  <div class="card"><h3>Factor Scores</h3><p>Quality 92 · Growth 61 · Momentum 78 · Valuation 54 · Risk 81</p></div>
  <p class="footer-note">Shared from StockEX — not investment advice.</p>
</div>
