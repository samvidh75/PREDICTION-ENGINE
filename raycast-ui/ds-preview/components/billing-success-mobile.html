<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 48px 24px; text-align: center; }
  .emoji { font-size: 44px; margin-bottom: 10px; }
  h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; }
  p { color: var(--body); font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
  .cta { display: block; padding: 12px; border-radius: 8px; background: var(--ink); color: #000; font-size: 13.5px; font-weight: 600; }
</style>
<div class="page">
  <div class="emoji">🎉</div>
  <h1>Payment Successful!</h1>
  <p>Your subscription is being activated. Confirmation email on its way.</p>
  <div class="cta">Go to Dashboard</div>
</div>
