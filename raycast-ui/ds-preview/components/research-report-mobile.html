<!-- @dsCard group="PREDICTION-ENGINE / CompanyResearchReport" -->
<style>
  :root { --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F; --accent:#FF6B4A; --red:#FF3B30; --bg-sheet: rgba(18,18,20,0.55); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 390px; padding: 20px 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { color: var(--mute); font-size: 11.5px; margin: 0; }
  .section { background: var(--bg-sheet); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px; display: grid; gap: 6px; }
  .section h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .tag { font-size: 9.5px; padding: 2px 7px; border-radius: 8px; background: rgba(255,107,74,0.14); color: var(--accent); margin-left: 6px; }
  .section p { margin: 0; font-size: 12px; color: var(--body); line-height: 1.5; }
</style>
<div class="page">
  <div><h1>BDO — Research Report</h1><p class="sub">Generated from available filings and market data</p></div>
  <div class="section"><h3>Business Overview</h3><p>Company overview and business model based on available data.</p></div>
  <div class="section"><h3>Financial Health<span class="tag">Score</span></h3><p>Revenue trends and key financial metrics.</p></div>
  <div class="section"><h3>Risk Assessment</h3><p>Key business and market risks.</p></div>
</div>
