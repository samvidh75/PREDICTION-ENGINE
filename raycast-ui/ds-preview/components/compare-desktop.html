<!-- @dsCard group="PREDICTION-ENGINE / Compare" -->
<style>
  :root {
    --canvas:#000; --ink:#FFF; --body:#B4B4B4; --mute:#8C8C8C; --hairline:#1F1F1F;
    --green:#34C759; --red:#FF3B30; --bg-sheet: rgba(18,18,20,0.55);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif; color:var(--ink); }
  .page { width: 1040px; padding: 32px; display: grid; gap: 20px; }
  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 8px 16px; font-size: 13px; color: var(--mute); border-radius: 6px; }
  .tab.active { background: var(--ink); color: #000; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--mute); padding: 12px; border-bottom: 1px solid var(--hairline); font-weight: 500; }
  th.sym-col { font-size: 16px; color: var(--ink); font-weight: 600; }
  td { padding: 12px; font-size: 13px; border-bottom: 1px solid var(--hairline); }
  .label { color: var(--body); }
  .best { color: var(--green); font-weight: 600; }
  .worst { color: var(--red); }
</style>
<div class="page">
  <h1>Compare</h1>
  <div class="tabs">
    <div class="tab active">Valuation</div><div class="tab">Quality</div><div class="tab">Growth</div><div class="tab">Dividend</div><div class="tab">Risk</div>
  </div>
  <table>
    <thead><tr><th>Metric</th><th class="sym-col">BDO</th><th class="sym-col">AC</th><th class="sym-col">SM</th></tr></thead>
    <tbody>
      <tr><td class="label">P/E Ratio</td><td class="best">9.4x</td><td>14.2x</td><td class="worst">18.1x</td></tr>
      <tr><td class="label">P/B Ratio</td><td class="best">1.2x</td><td>1.8x</td><td>2.1x</td></tr>
      <tr><td class="label">Dividend Yield</td><td class="best">4.1%</td><td>2.3%</td><td class="worst">1.1%</td></tr>
      <tr><td class="label">ROE</td><td>15.8%</td><td class="best">18.2%</td><td>16.4%</td></tr>
      <tr><td class="label">Debt / Equity</td><td class="best">0.42</td><td>0.68</td><td class="worst">0.91</td></tr>
    </tbody>
  </table>
</div>
