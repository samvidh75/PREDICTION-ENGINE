version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# StockEX Philippines — docker-compose.yml
# Services:
#   api       – Fastify backend (port 4001)
#   web       – Nginx serving the Vite SPA (port 80 / 443)
#   postgres  – PostgreSQL database
#   redis     – Redis cache
#   qdrant    – Free vector DB (port 6333)
#   lora      – StockEX LoRA inference server (port 3001)
#   prometheus – Free metrics collection (port 9090)
#   grafana   – Free dashboards (port 3000)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API (Fastify backend) ────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runner
    container_name: stockex_api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "4001"
      HOST: "0.0.0.0"
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - stockex_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Web (Nginx static + reverse-proxy) ──────────────────────────────────
  web:
    image: nginx:1.27-alpine
    container_name: stockex_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - stockex_net

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stockex_postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: stockstory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockex_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stockex_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - stockex_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── StockEX LoRA Inference Server ────────────────────────────────────────
  lora:
    build:
      context: .
      dockerfile: docker/lora.Dockerfile
    container_name: stockex_lora
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      LORA_SERVER_PORT: "3001"
      LORA_SERVER_HOST: "0.0.0.0"
    volumes:
      - ./stockex_slm_agent_output:/app/stockex_slm_agent_output:ro
    networks:
      - stockex_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ai/status"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ── Qdrant — Free vector database (replaces Pinecone) ──────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stockex_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - stockex_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus — Free metrics collection ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: stockex_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - stockex_net

  # ── Grafana — Free dashboards ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: stockex_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - stockex_net

volumes:
  postgres_data:
  redis_data:
  lora_data:
  qdrant_storage:
  qdrant_snapshots:
  prometheus_data:
  grafana_storage:

networks:
  stockex_net:
    driver: bridge
